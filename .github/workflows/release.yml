# Medfin: builds tlx for each platform and publishes the archives as a GitHub
# release. Push a tag `vX.Y.Z` that matches the workspace version in Cargo.toml.
# A manual run builds and smoke-tests the archives without publishing anything.
#
# Asset names follow `tlx-<version>-<target>.tar.gz`, which mise's `github:`
# backend matches to the platform without extra config. See MEDFIN.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release builds keep `debug = 1` for profiling; the published binary only
  # needs symbols, not line tables, so strip the debug info to keep it small.
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            zig: false
          # Linux builds link against glibc 2.17 through cargo-zigbuild, so the
          # binary runs on any newer glibc (Ubuntu 24.04, Amazon Linux 2023).
          # It stays dynamically linked: tlx dlopens the C it generates, which
          # a static musl binary cannot do.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            zig: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            zig: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi

      # rust-toolchain.toml pins the compiler; rustup installs it here.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.zig
        with:
          python-version: "3.12"

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: python3 -m pip install cargo-zigbuild==0.24.1 ziglang==0.15.2

      - name: Build
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked -p tlx-cli --target ${{ matrix.target }}.2.17
          else
            cargo build --release --locked -p tlx-cli --target ${{ matrix.target }}
          fi

      - name: Smoke test
        run: target/${{ matrix.target }}/release/tlx check -h > /dev/null

      - name: Show the glibc versions the binary needs
        if: matrix.zig
        run: objdump -T target/${{ matrix.target }}/release/tlx | grep -o 'GLIBC_[0-9.]*' | sort -uV

      - name: Package
        run: |
          archive="tlx-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C target/${{ matrix.target }}/release tlx
          ls -l "$archive"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tlx-${{ matrix.target }}
          path: tlx-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tlx-*
          merge-multiple: true

      - name: Write checksums
        run: sha256sum tlx-*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" tlx-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt tlx binaries from Medfin's fork. See MEDFIN.md for what differs from upstream."
